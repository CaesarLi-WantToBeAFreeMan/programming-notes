<!DOCTYPE html>
<html>
    <head>
        <title>Left Frame</title>
    </head>
    <body>
        <h1>left frame</h1>
        <a href = "PDFs/04/example.pdf" target = "_blank">open in new tab (_blank)</a><br>
        <a href = "PDFs/04/example.pdf" target = "_self">open in this frame (_self)</a><br>
        <a href = "PDFs/04/example.pdf" target = "_parent">open in parent frame (_parent)</a><br>
        <a href = "PDFs/04/example.pdf" target = "_top">open in topmost window (_top)</a><br>
        <a href = "PDFs/04/example.pdf" target = "rightFrame">open in right frame (frameName)</a>
    </body>
</html>
